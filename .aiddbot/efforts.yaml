# Effort per role, and the model each harness uses for each effort.
# scripts/adapt.js writes the resolved model into every harness's agent
# definition at release time; no agent reads this file.
roles:
  architect: high
  builder: medium
  craftsman: high

models:
  claude-code:
    low: haiku
    medium: sonnet
    high: opus
  codex:
    low: gpt-5.6-luna
    medium: gpt-5.6-terra
    high: gpt-5.6-sol
  copilot:
    low: gpt-5.4-mini
    medium: claude-sonnet-4.6, gpt-5.4
    high: claude-opus-4.6, gpt-5.4
  cursor:
    low: Auto
    medium: Auto
    high: Auto
