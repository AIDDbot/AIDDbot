orchestrator: architect-solution-foundation
flow:
  - IF: existing application code is identifiable
    worker: map-solution
    flow:
      - skill: explore
        agent: Architect
      - FOR-EACH: container
        skill: extract
        agent: Architect
  - IF: repository is empty or documentation-only
    worker: design-solution
    flow:
      - skill: explore
        agent: Architect
      - skill: specify
        agent: Architect
        with: { kind: technical }
      - skill: scaffoldify
      - worker: map-solution
        flow:
          - skill: explore
            agent: Architect
          - FOR-EACH: container
            skill: extract
            agent: Architect
  - IF: files exist but classification is unsafe
    action: ask the user, then follow the selected route
  - RETURN: architected solution foundation ready for delivery
