orchestrator: architect-solution-foundation
intent: understand, design, or prepare a solution architecture
inputs:
  - user intent
  - repository evidence and existing architecture documents
stages:
  - resolve requested outcome
  - map-solution when understanding existing code
  - design-solution when defining a new or evolved architecture
  - materialize through design-solution only when an executable foundation is requested
human_decisions:
  - clarify only when the requested outcome or a material choice is ambiguous
outcomes:
  - mapped architecture
  - validated design
  - prepared executable foundation
  - ambiguity or blocker
