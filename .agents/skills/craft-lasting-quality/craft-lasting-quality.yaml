orchestrator: craft-lasting-quality
intent: maintain existing solution quality from current evidence
inputs:
  - findings ledger and recorded reports
  - optional human-named finding or new defect evidence
  - optional request for a current quality review
stages:
  - collect-findings for new evidence
  - clean-solution then collect-findings for an explicit current review or when no eligible work exists
  - select and confirm one eligible scope
  - accept the scope before fix-defects
  - ship-implementation after fixes
human_decisions:
  - requested contract changes or unsupported expected behavior require a specification
outcomes:
  - released remediation
  - no eligible findings
  - need for specification
  - blocker
