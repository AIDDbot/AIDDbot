orchestrator: craft-lasting-quality
intent: review current quality and release one correction batch
inputs:
  - current repository and automated quality evidence
rejects:
  - human defect evidence
  - human-named findings
  - human priority
stages:
  - resume an unfinished fixed batch, or run clean-solution and collect-findings
  - group findings by shared cause and correction
  - select up to five eligible groups
  - classify one origin-craft intent-fix change
  - deliver-change once without planning and with final verification
outcomes:
  - released remediation batch
  - no eligible findings
  - blocker
