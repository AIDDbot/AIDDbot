document:
  title: Adaptive AIDD delivery
  status: implemented
  executable: false
  authority:
    - .agents/skills/skills.catalog.md
    - docs/AIDD.workflow.md

change:
  branch: change/{change_key}
  status: [pending, in-progress, ready, released]
  dimensions:
    origin: [requested, craft]
    kind: [functional, technical, mixed]
    intent: [modify, fix]
    complexity: [simple, complex]
  references:
    specs: zero-or-more
    findings: zero-or-more

policy:
  plan:
    enabled_when: complexity-is-complex-and-intent-is-modify
  verify:
    enabled_when:
      - origin-is-craft
      - requested-kind-is-functional-or-mixed
  qualify:
    enabled_when: complexity-is-complex
  evidence:
    technical-criteria-without-qualification: codify
    functional-criteria: verify
    technical-criteria-with-qualification: qualify

delivery:
  orchestrator: build-requested-change
  sequence:
    - classify
    - persist-change
    - specify-durable-contracts-when-needed
    - plan-when-enabled
    - implement
    - verify-when-enabled
    - qualify-when-enabled
    - mark-ready
    - ship-once
  adaptation:
    - reclassify-before-implementation-and-after-repair
    - future-stages-may-only-be-enabled
    - semantic-writes-invalidate-affected-evidence

craft:
  accepts_human_findings: false
  discovery: current-quality-review
  batch:
    maximum_repair_groups: 5
    group_by: shared-cause-and-correction
    order: [severity, impact, bounded-scope]
    plan: false
    verify_once: true
    qualify_when: complex
    release_once: true
  resume: keep-original-finding-set
  empty: no-branch-no-release
