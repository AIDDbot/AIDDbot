# Full definition once at the root.
# Public invoke: name only — see that key.
# Internal invoke: reduced (`invokes` tree only).

scaffold-workshop:
  purpose: Assemble, install, smoke-test, and commit a monorepo from catalogued archetypes.
  skills: []
  handoff: map-solution

map-solution:
  purpose: Map an existing codebase before anyone builds.
  skills:
    - explore
    - extract
  handoff: specify-feature

design-solution:
  purpose: Design a greenfield architecture and write its technical spec.
  skills:
    - explore
    - specify
  handoff: implement-spec

specify-feature:
  purpose: Triage a requirement — one spec or a coordinated multi-spec change.
  skills:
    - specify
  invokes:
    implement-spec: # 1 spec; after approval or YOLO
    deliver-change: # N specs; after confirm or YOLO
      invokes:
        fix-defects: # verify/qualify red; then restart from verify

implement-spec:
  purpose: Plan and code a validated spec, then review.
  skills:
    - planify
    - codify
  invokes:
    review-implementation:

review-implementation:
  purpose: Verify, qualify, and ship one specification.
  skills:
    - verify
    - qualify
    - shipify
  invokes:
    fix-defects: # verify/qualify red; then restart from verify

deliver-change:
  internal: true
  purpose: Scope, specify, implement, review, and ship several specs on one branch.
  skills:
    - scope-change
    - specify
    - planify
    - codify
    - verify
    - qualify
    - shipify
  invokes:
    fix-defects: # verify/qualify red; then restart from verify

fix-defects:
  purpose: Apply a defect report in code.
  skills:
    - codify

clean-solution:
  purpose: Hunt CRAP and lint across the whole codebase — not tied to a spec.
  skills: []
  invokes:
    fix-defects:

clean-drift:
  catalog: missing
  purpose: Hunt orphaned decay and code drift in qualify reports — not tied to a spec.
  skills: []
  invokes:
    fix-defects:
