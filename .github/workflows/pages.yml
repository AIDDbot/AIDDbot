name: Publish the knowledge explorer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install explorer dependencies
        run: bun install --cwd packages/explorer --frozen-lockfile
      - name: Build the explorer
        run: bun run explorer:build
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/explorer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publication
        uses: actions/deploy-pages@v4
